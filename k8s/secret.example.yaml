# Do NOT commit real values. Create the real secret with:
# kubectl -n pbl create secret generic backend-secret \
#   --from-literal=MONGO_URI='mongodb://mongo:27017/pbl' \
#   --from-literal=JWT_SECRET='change-me'
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: pbl
stringData:
  MONGO_URI: mongodb://mongo:27017/pbl
  JWT_SECRET: change-me
